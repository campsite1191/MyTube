name: Keep ccache Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM: android-arm
  BUILD_TYPE: gold

jobs:
  keep-alive:
    name: Refresh ccache TTL
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.PLATFORM }}-${{ env.BUILD_TYPE }}-keepalive-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.PLATFORM }}-${{ env.BUILD_TYPE }}-
