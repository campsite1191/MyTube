name: Lint & Bundle JS

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/lint_js.yml'

jobs:
  lint_js:
    name: "Lint & Bundle JS"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Run Regression Tests
        run: npm test

      - name: Install Build & Type Dependencies
        run: npm --prefix mods install --no-audit --no-fund

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint Source Files with Biome
        run: |
          echo '{"files":{"includes":["**","!!**/tiny-sha256.js"]}}' > biome.json
          npx --yes @biomejs/biome@2.3.8 lint --only=correctness --diagnostic-level=error \
            mods/core/config.ts \
            mods/index.ts \
            mods/core \
            mods/transforms \
            mods/types \
            mods/features \
            mods/ui \
            mods/utils \
            tests

      - name: Build Userscript Bundle
        run: |
          npm run build:js
          ls -lh mods/dist/userscript.js
