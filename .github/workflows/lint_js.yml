name: Lint & Bundle JS

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'knip.json'
      - 'biome.json'
      - '.github/workflows/lint_js.yml'

jobs:
  lint_js:
    name: "Lint & Bundle JS"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Build & Type Dependencies
        run: npm --prefix mods install --no-package-lock --no-audit --no-fund

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Check Dead Files, Exports & Types with Knip
        run: npm run lint:knip

      - name: Lint & Format Check with Biome
        run: npm run lint:biome

      - name: Build Userscript Bundle
        run: |
          npm run build:js
          ls -lh mods/dist/userscript.js

      - name: Run Regression & E2E Tests with 100% Coverage
        run: npm run lint:coverage
