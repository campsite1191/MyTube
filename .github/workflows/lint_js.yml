name: Lint & Bundle JS

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'knip.json'
      - '.github/workflows/lint_js.yml'

jobs:
  lint_js:
    name: "Lint & Bundle JS"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Build & Type Dependencies
        run: npm --prefix mods install --no-audit --no-fund

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Check Dead Files, Exports & Types with Knip
        run: npm run lint:knip

      - name: Lint Source Files with Biome
        run: |
          npx --yes @biomejs/biome@2.3.8 lint \
            --only=correctness --only=suspicious --only=complexity --only=performance \
            --diagnostic-level=error \
            mods/index.ts \
            mods/core \
            mods/interceptors \
            mods/transforms \
            mods/types \
            mods/features \
            mods/ui \
            mods/utils \
            tests

      - name: Build Userscript Bundle
        run: |
          npm run build:js
          ls -lh mods/dist/userscript.js

      - name: Run Regression & E2E Tests with Coverage
        run: npm run test:coverage
